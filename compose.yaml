# Local / single-host deployment.
#
#   docker compose up -d --build
#
# Values come from `.env` (gitignored). Only the postgres credentials are
# defaulted here, and only for a local database that is not published to the
# host beyond its own port.

name: wali-epi

services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-wali_epi}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wali_epi_password}
            POSTGRES_DB: ${POSTGRES_DB:-wali_epi_db}
        volumes:
            # 18+ expects the mount at /var/lib/postgresql; the image puts the
            # cluster in a versioned subdirectory so pg_upgrade can work.
            - pgdata:/var/lib/postgresql
        ports:
            # Bound to loopback: the database is for this host, not the network.
            - '127.0.0.1:5432:5432'
        healthcheck:
            # -U and -d must be passed explicitly: pg_isready defaults to the
            # invoking user, which is not the app's role.
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-wali_epi} -d ${POSTGRES_DB:-wali_epi_db}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        # BullMQ needs persistence across a restart, or queued jobs are lost.
        command: redis-server --appendonly yes
        volumes:
            - redisdata:/data
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    # One-shot: applies drizzle migrations, then exits. `app` and `worker`
    # wait on it, so neither ever queries a schema that is not there yet.
    migrate:
        image: wali-epi:latest
        build:
            context: .
            target: runner
        command: ['npm', 'run', 'db:migrate']
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # No `env_file: .env` here on purpose. Migrations touch the schema and
        # nothing else, so this service is given the one variable it needs
        # rather than the full secret set (auth, OAuth, PII keys, S3).
        environment:
            # Overrides any .env value: inside the network the database is a
            # service name, not localhost.
            DATABASE_URL: postgresql://${POSTGRES_USER:-wali_epi}:${POSTGRES_PASSWORD:-wali_epi_password}@postgres:5432/${POSTGRES_DB:-wali_epi_db}
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'

    app:
        image: wali-epi:latest
        build:
            context: .
            target: runner
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        env_file:
            - path: .env
              required: false
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-wali_epi}:${POSTGRES_PASSWORD:-wali_epi_password}@postgres:5432/${POSTGRES_DB:-wali_epi_db}
            REDIS_URL: redis://redis:6379
            WHATSAPP_ALLOWED_INTERNAL_ORIGINS: ${WHATSAPP_ALLOWED_INTERNAL_ORIGINS:-http://openwa:2785}
        ports:
            - '${APP_PORT:-3000}:3000'
        volumes:
            # Attachments are written to local disk; without this they are lost
            # on every recreate.
            - uploads:/app/uploads
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    worker:
        image: wali-epi:latest
        build:
            context: .
            target: runner
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # Runs the TypeScript source through tsx, the same way `npm run worker`
        # does locally. It is a separate service because a long job must not
        # occupy a web request, and restarting the web app must not kill it.
        command: ['npm', 'run', 'worker']
        restart: unless-stopped
        # The worker inherits the image's HTTP healthcheck but serves no port,
        # so it reported unhealthy forever. Liveness here is "the process is
        # still up", which restart: unless-stopped already watches.
        healthcheck:
            disable: true
        env_file:
            - path: .env
              required: false
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-wali_epi}:${POSTGRES_PASSWORD:-wali_epi_password}@postgres:5432/${POSTGRES_DB:-wali_epi_db}
            REDIS_URL: redis://redis:6379
            WHATSAPP_ALLOWED_INTERNAL_ORIGINS: ${WHATSAPP_ALLOWED_INTERNAL_ORIGINS:-http://openwa:2785}
        volumes:
            # The export job writes files the web app then serves, so both
            # services must see the same directory.
            - uploads:/app/uploads
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    # Self-hosted WhatsApp gateway (OpenWA, Baileys engine + SQLite).
    # Dashboard & QR pairing bound to loopback only; app/worker reach it via http://openwa:2785.
    openwa:
        image: ghcr.io/rmyndharis/openwa:latest
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - KILL
            - SETGID
            - SETUID
        read_only: true
        tmpfs:
            - /tmp
        pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
        mem_limit: ${OPENWA_MEM_LIMIT:-1g}
        ports:
            - '127.0.0.1:${OPENWA_PORT:-2785}:2785'
        environment:
            NODE_ENV: production
            TZ: ${TZ:-Asia/Jakarta}
            HOME: /tmp
            XDG_CONFIG_HOME: /tmp/.config
            XDG_CACHE_HOME: /tmp/.cache
            PORT: 2785
            LOG_LEVEL: ${OPENWA_LOG_LEVEL:-info}
            ENGINE_TYPE: ${OPENWA_ENGINE_TYPE:-baileys}
            AUTO_START_SESSIONS: ${OPENWA_AUTO_START_SESSIONS:-true}
            CSP_UPGRADE_INSECURE_REQUESTS: ${OPENWA_CSP_UPGRADE_INSECURE_REQUESTS:-false}
            SIMULATE_TYPING: ${OPENWA_SIMULATE_TYPING:-true}
            SIMULATE_TYPING_MAX_MS: ${OPENWA_SIMULATE_TYPING_MAX_MS:-5000}
            SEND_PACING_ENABLED: ${OPENWA_SEND_PACING_ENABLED:-true}
            SEND_PACING_WARMUP_SCHEDULE: ${OPENWA_WARMUP_SCHEDULE:-20,40,80,160,320,640,1000}
            SEND_PACING_COLD_DAILY_CAP: ${OPENWA_COLD_DAILY_CAP:-5,10,20,40,60,80,100}
            SEND_PACING_BREAKER_THRESHOLD: ${OPENWA_BREAKER_THRESHOLD:-5}
            SEND_PACING_BREAKER_COOLDOWN_MS: ${OPENWA_BREAKER_COOLDOWN_MS:-900000}
        volumes:
            - openwadata:/app/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

volumes:
    pgdata:
    redisdata:
    uploads:
    openwadata:
