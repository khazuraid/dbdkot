# Coolify 1-package deployment (Docker Compose build pack).
#
# In Coolify:
#   Build Pack              : Docker Compose
#   Docker Compose Location : /compose.coolify.yaml
#
# Coolify auto-generates and persists SERVICE_* secrets and SERVICE_URL_* domains.
# Set ADMIN_EMAIL + ADMIN_PASSWORD (>=10 chars) in Coolify Environment Variables
# before first deploy so `migrate` seeds the initial ADMIN account automatically.

services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-wali_epi}
            POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
            POSTGRES_DB: ${POSTGRES_DB:-wali_epi_db}
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-wali_epi} -d ${POSTGRES_DB:-wali_epi_db}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        command: redis-server --appendonly yes
        volumes:
            - redisdata:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    migrate:
        build:
            context: .
            target: runner
            args:
                NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-WALI-EPI}
                NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        exclude_from_hc: true
        healthcheck:
            disable: true
        command:
            - sh
            - -c
            - 'npm run db:migrate && if [ -n "$$ADMIN_EMAIL" ] && [ -n "$$ADMIN_PASSWORD" ]; then npm run db:seed-admin; else echo "ADMIN_EMAIL/ADMIN_PASSWORD kosong, skip db:seed-admin"; fi'
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-wali_epi}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-wali_epi_db}
            BETTER_AUTH_SECRET: ${SERVICE_HEX_64_AUTH}
            ADMIN_EMAIL: ${ADMIN_EMAIL:-}
            ADMIN_NAME: ${ADMIN_NAME:-Administrator}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'

    app:
        build:
            context: .
            target: runner
            args:
                NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-WALI-EPI}
                NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        expose:
            - '3000'
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-wali_epi}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-wali_epi_db}
            REDIS_URL: redis://redis:6379
            BETTER_AUTH_SECRET: ${SERVICE_HEX_64_AUTH}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${SERVICE_URL_APP_3000}}
            NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-WALI-EPI}
            NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${SERVICE_URL_APP_3000}}
            TRUST_PROXY: ${TRUST_PROXY:-true}
            PII_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_PIIENC}
            PII_HASH_KEY: ${SERVICE_HEX_64_PIIHASH}
            WHATSAPP_ALLOWED_INTERNAL_ORIGINS: ${WHATSAPP_ALLOWED_INTERNAL_ORIGINS:-http://openwa:2785}
            WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
            WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
            WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
            WHATSAPP_SESSION_ID: ${WHATSAPP_SESSION_ID:-}
            DINKES_ALERT_PHONE: ${DINKES_ALERT_PHONE:-}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-}
            SMTP_SECURE: ${SMTP_SECURE:-}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASS: ${SMTP_PASS:-}
            SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
            SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
            SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
            SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
            NOMINATIM_URL: ${NOMINATIM_URL:-}
            TILE_UPSTREAM: ${TILE_UPSTREAM:-}
        volumes:
            - uploads:/app/uploads
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    worker:
        build:
            context: .
            target: runner
            args:
                NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-WALI-EPI}
                NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        command: ['npm', 'run', 'worker']
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        healthcheck:
            disable: true
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-wali_epi}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-wali_epi_db}
            REDIS_URL: redis://redis:6379
            WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
            PII_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_PIIENC}
            PII_HASH_KEY: ${SERVICE_HEX_64_PIIHASH}
            WHATSAPP_ALLOWED_INTERNAL_ORIGINS: ${WHATSAPP_ALLOWED_INTERNAL_ORIGINS:-http://openwa:2785}
            WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
            WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
            WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
            WHATSAPP_SESSION_ID: ${WHATSAPP_SESSION_ID:-}
            DINKES_ALERT_PHONE: ${DINKES_ALERT_PHONE:-}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-}
            SMTP_SECURE: ${SMTP_SECURE:-}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASS: ${SMTP_PASS:-}
            SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
            SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
            SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
            SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-}
        volumes:
            - uploads:/app/uploads
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    openwa:
        image: ghcr.io/rmyndharis/openwa:latest
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - KILL
            - SETGID
            - SETUID
        read_only: true
        tmpfs:
            - /tmp
        pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
        mem_limit: ${OPENWA_MEM_LIMIT:-1g}
        expose:
            - '2785'
        environment:
            NODE_ENV: production
            TZ: ${TZ:-Asia/Jakarta}
            HOME: /tmp
            XDG_CONFIG_HOME: /tmp/.config
            XDG_CACHE_HOME: /tmp/.cache
            PORT: 2785
            LOG_LEVEL: ${OPENWA_LOG_LEVEL:-info}
            ENGINE_TYPE: ${OPENWA_ENGINE_TYPE:-baileys}
            AUTO_START_SESSIONS: ${OPENWA_AUTO_START_SESSIONS:-true}
            API_MASTER_KEY: ${SERVICE_HEX_64_OPENWA}
            TRUSTED_PROXIES: ${OPENWA_TRUSTED_PROXIES:-loopback,linklocal,uniquelocal}
            CSP_UPGRADE_INSECURE_REQUESTS: ${OPENWA_CSP_UPGRADE_INSECURE_REQUESTS:-true}
            OPENWA_PUBLIC_URL: ${SERVICE_URL_OPENWA_2785}
            SIMULATE_TYPING: ${OPENWA_SIMULATE_TYPING:-true}
            SIMULATE_TYPING_MAX_MS: ${OPENWA_SIMULATE_TYPING_MAX_MS:-5000}
            SEND_PACING_ENABLED: ${OPENWA_SEND_PACING_ENABLED:-true}
            SEND_PACING_WARMUP_SCHEDULE: ${OPENWA_WARMUP_SCHEDULE:-20,40,80,160,320,640,1000}
            SEND_PACING_COLD_DAILY_CAP: ${OPENWA_COLD_DAILY_CAP:-5,10,20,40,60,80,100}
            SEND_PACING_BREAKER_THRESHOLD: ${OPENWA_BREAKER_THRESHOLD:-5}
            SEND_PACING_BREAKER_COOLDOWN_MS: ${OPENWA_BREAKER_COOLDOWN_MS:-900000}
        volumes:
            - openwadata:/app/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

volumes:
    pgdata:
    redisdata:
    uploads:
    openwadata:
