name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # Placeholders: `next build` evaluates the auth route handler and requires
      # these to be present. No database is contacted during the build.
      DATABASE_URL: postgresql://wali_epi:wali_epi_password@localhost:5432/wali_epi_db
      BETTER_AUTH_SECRET: ci-placeholder-secret-0000000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      # Schema drift: a column edited without a migration would otherwise be
      # discovered only on a real database. Exits non-zero when generate would
      # emit a new file.
      - name: Schema matches migrations
        run: npx drizzle-kit generate --name ci-drift-check && git diff --exit-code drizzle/

      - name: Build
        run: npm run build
