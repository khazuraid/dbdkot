name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Checks formatting instead of rewriting files: a workflow that mutates the
      # tree while holding `contents: read` fails confusingly, and auto-commits
      # bypass review. Run `npm run format` locally before pushing.
      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint
