name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Checks formatting instead of rewriting files: a workflow that mutates the
      # tree while holding `contents: read` fails confusingly, and auto-commits
      # bypass review. Run `npm run format` locally before pushing.
      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint
